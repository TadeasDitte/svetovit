name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.5'

      - name: Build linux/amd64 binary
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -o dist/svetovit-linux-amd64 ./cmd/svetovit

      - name: Set release tag
        id: vars
        run: echo "tag=build-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          files: dist/svetovit-linux-amd64
