name: wordpress
markers:
- wp-load.php
- wp-includes/version.php
version:
  - file: wp-includes/version.php
    regex: '\$wp_version\s*=\s*[''"]([^''"]+)[''"]'

plugins:
  - glob: "wp-content/plugins/*"
    version:
      - file: "*.php"
        regex: '(?i)Plugin Name:(?:[^*]|\*+[^*/])*?\n[ \t/*#@]*Version:[ \t]*([^\s*]+)'
      - file: "readme.txt"
        regex: '(?i)Stable tag:\s*([0-9][^\s]*)'
  - glob: "wp-content/themes/*"
    version:
      - file: "style.css"
        regex: '(?mi)^[ \t/*#@]*Version:[ \t]*([^\s*]+)'
skip:
  - wp-content/uploads
  - wp-content/cache
