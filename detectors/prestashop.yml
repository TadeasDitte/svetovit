name: prestashop
markers:
- config/settings.inc.php
version:
  - file: config/settings.inc.php
    regex: 'define\(\s*[''"]_PS_VERSION_[''"]\s*,\s*[''"]([^''"]+)[''"]'
  - file: app/AppKernel.php
    regex: 'const VERSION\s*=\s*[''"]([^''"]+)[''"]'
plugins:
  - glob: "modules/*"
    version:
      - file: "config.xml"
        regex: '<version><!\[CDATA\[([^\]]+)\]\]></version>'
  - glob: "themes/*"
    version:
      - file: "config/theme.yml"
        regex: '(?m)^version:\s*[''"]?([^''"\s]+)'
skip:
  - var/cache
  - cache
  - img
